version: '3.9'
services:
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  backend:
    build:
      context: ../backend
    privileged: true
    environment:
      REDIS_URL: redis://redis:6379/0
      FIREWALL_DRY_RUN: 'true'
      TRUST_X_FORWARDED_FOR: 'false'
    depends_on:
      - redis
    ports:
      - '8000:8000'

  frontend:
    build:
      context: ../frontend
    ports:
      - '5173:80'
    depends_on:
      - backend
